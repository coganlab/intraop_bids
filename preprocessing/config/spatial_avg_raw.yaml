bids_root: ???
patient: ???
task: ???

load_kwargs:
  preload: true

# List of square contact sizes (in original-grid cells) to generate
# spatial-average derivatives for.  Each value writes a separate
# `desc-contact{N}_ieeg.edf` derivative.
contact_sizes: [2, 4, 8]

overwrite: true

# Drop fully-NaN rows / columns from the chanmap before averaging.
# Useful for multi-array recordings (e.g. S83) where a NaN gap row
# between two arrays would otherwise prevent larger contacts from
# tiling cleanly across the gap.
compact_chanmap: false
