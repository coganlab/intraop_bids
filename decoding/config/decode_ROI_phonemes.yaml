bids_root: ???
task: ???

# ROI definitions (assuming APARC 2009)
roi: ???
roi_dict:
    SMC: [
        "G_precentral",
        "G_postcentral",
        "S_central"
    ]
    Auditory: [
        "G_temp_sup-Plan_tempo",
        "G_temp_sup-Lateral",
        "G_temp_sup-Plan_polar",
        "S_temporal_sup",
        "S_temporal_transverse"
    ]
    # Temporal language and association
    PosteriorTemporal: [
        "G_temp_middle",
        "S_temporal_inf"
    ]
    VentralTemporal: [
        "G_temp_inf",
        "G_oc-temp_lat-fusifor",
        "G_oc-temp_med-Lingual"
    ]
    AnteriorTemporal: [
        "Pole_temporal",
        "G_parahippocampal"
    ]
    # Frontal
    InferiorFrontal: [
        "G_front_inf-Opercular",
        "G_front_inf-Triangul",
        "S_front_inf"
    ]
    PremotorFrontal: [
        "G_front_middle",
        "G_front_sup",
        "S_front_middle",
        "S_front_sup"
    ]
    Orbitofrontal: [
        "G_front_inf-Orbital",
        "G_orbital",
        "G_rectus",
        "S_orbital_lateral",
        "S_orbital_medial"
    ]
    # Parietal
    InferiorParietal: [
        "G_pariet_inf-Supramar",
        "G_pariet_inf-Angular",
        "S_intrapariet_and_P_trans"
    ]
    SuperiorParietal: [
        "G_parietal_sup",
        "G_precuneus"
    ]
    # Other speech-related association areas
    Insula: [
        "G_insular_short",
        "G_insular_long",
        "S_circular_insula_ant",
        "S_circular_insula_sup",
        "S_circular_insula_inf"
    ]
    Cingulate: [
        "G_and_S_cingul-Ant",
        "G_and_S_cingul-Mid-Ant",
        "G_and_S_cingul-Mid-Post",
        "G_and_S_cingul-Post"
    ]
    # Occipital
    Occipital: [
        "G_occipital_sup",
        "G_occipital_middle",
        "G_occipital_inf",
        "G_cuneus",
        "S_calcarine"
    ]
hemi:
  - "lh"
  - "rh"

phoneme_idx: -1    # -1 for all phonemes, 1..N for specific position
n_phons: 3 # number of phonemes in target, cross-patient are still decided on the fly to allow pooling with various phoneme amounts

patients: [D0019, D0022, D0023, D0024, D0025, D0028, D0029, D0035,
           D0040, D0041, D0042, D0045, D0049, D0052, D0053, D0054, D0055,
           D0056, D0057, D0058, D0059, D0060, D0061, D0063, D0064, D0066,
           D0067, D0068, D0069, D0070, D0071, D0073, D0075, D0077,
           D0079, D0084, D0085, D0086, D0088, D0091, D0092, D0093, D0094,
           D0095, D0096, D0100, D0102, D0103]

# BIDS file matching
# description: productionMeanSub
description: productionZscore
# Band suffix. Single string or list to combine bands (concatenated along
# the channel axis). All cross-patient subjects must have the same band
# set on disk. Examples:
#   suffix: highGamma
#   suffix: [highGamma, spikeBand]
suffix: highGamma
extension: .fif
datatype: "epoch(band)(power)"

# Decoding parameters
n_folds: 20
n_iter: 10
compute_chance: false
pca_variance: 0.8
svm_kernel: rbf
time_window: [-0.5, 0.5]

# Output (null = auto-derived from bids_root)
results_root: null

output_suffix: null
# output_suffix: roiAud
# output_suffix: roiSMC

