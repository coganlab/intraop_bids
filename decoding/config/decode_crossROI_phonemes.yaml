# BIDS file matching
# description: productionMeanSub
description: productionZscore
# Band suffix. Single string or list to combine bands (concatenated along
# the channel axis). All cross-patient subjects must have the same band
# set on disk. Examples:
#   suffix: highGamma
#   suffix: [highGamma, spikeBand]
suffix: highGamma
extension: .fif
datatype: "epoch(band)(power)"

random_data: false
tar_in_train: true


# Decoding parameters
n_folds: 20
n_iter: 10
pca_variance_align: 0.9
pca_variance_decode: 0.8
svm_kernel: rbf
decode_tw: [-0.5, 0.5]

# Time window for alignment (null = full epoch)
time_window: null

# Output (null = auto-derived from bids_root)
results_root: null

output_suffix: null
# output_suffix: randomSrcData
# output_suffix: roiAud
# output_suffix: roiSMC

